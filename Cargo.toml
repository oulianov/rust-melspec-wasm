[package]
name = "rust-melspec-wasm"
version = "0.1.0-neuralanalog.1"
edition = "2021"
repository = "https://github.com/oulianov/rust-melspec-wasm"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.5"
realfft = "3.5.0"
rustfft = "6.4.1"

[features]
# rustfft's WebAssembly SIMD kernels. Build with
# RUSTFLAGS="-C target-feature=+simd128"; the result needs WebAssembly SIMD.
simd = ["rustfft/wasm_simd"]
